name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # --no-fatal-infos / --no-fatal-warnings: only actual errors fail the
      # build. Info/warning-level lints (deprecated APIs, style nits, etc.)
      # still print in the log for visibility, but won't block CI on their
      # own. Tighten this later once the codebase is fully lint-clean.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # - run: flutter test   # enable once you add tests
